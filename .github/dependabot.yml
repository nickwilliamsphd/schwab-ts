version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      # Vite+ pins an exact Vitest, so these two must move together.
      vite-plus:
        patterns: [vite-plus, '@vitest/*']
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
